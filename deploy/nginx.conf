# nginx config for the job-ability-graph frontend container.
# Serves the Vite build and proxies /api + /health to the backend service.

upstream job_backend {
    server backend:8002;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # SPA history fallback: unknown paths -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived static assets can be cached aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Backend API (axios uses /api/v1/...)
    location /api/ {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM-backed endpoints can take a long time (report / learning advice / auto-match).
        proxy_connect_timeout 30s;
        proxy_read_timeout 400s;
        proxy_send_timeout 400s;
    }

    # Liveness/health used by the UI and operators.
    location = /health {
        proxy_pass http://backend:8002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
}
