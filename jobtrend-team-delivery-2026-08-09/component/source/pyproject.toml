[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-discovery-service"
version = "0.1.0"
description = "Auditable AI job-trend and emerging-role discovery pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "cryptography>=43,<48",
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "qdrant-client>=1.12,<2",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
documents = ["docling>=2.50,<3"]
dev = ["build>=1.2,<2", "pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
jobtrend = "trend_discovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trend_discovery = ["default.yaml", "handoff_readme.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["trend_discovery"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
