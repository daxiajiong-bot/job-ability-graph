<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>岗位能力图谱 Demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>岗位能力图谱与人岗匹配</h1>
          <p>新岗位发现 · 能力演化 · 全景图谱 · 匹配诊断</p>
        </div>
        <div class="status-line">
          <span id="apiStatus" class="status-dot"></span>
          <span id="apiStatusText">检查服务</span>
        </div>
      </header>

      <section class="workspace">
        <aside class="tool-panel">
          <div class="mode-tabs" role="tablist">
            <button id="modePanorama" class="tab-button active" type="button">全景图谱</button>
            <button id="modeMatch" class="tab-button" type="button">人岗匹配</button>
          </div>

          <div id="panoramaControls" class="control-group">
            <label for="jobSelect">岗位样例</label>
            <select id="jobSelect" multiple size="4"></select>
            <button id="buildPanoramaBtn" class="primary-button" type="button">生成全景图谱</button>
          </div>

          <div id="matchControls" class="control-group hidden">
            <div class="input-mode-switch">
              <button id="modeSample" class="switch-btn active" type="button">选择样例</button>
              <button id="modeCustom" class="switch-btn" type="button">手动输入</button>
            </div>

            <div id="matchSampleArea">
              <label for="matchJdSelect">目标岗位</label>
              <select id="matchJdSelect"></select>
              <label for="matchResumeSelect">候选简历</label>
              <select id="matchResumeSelect"></select>
            </div>

            <div id="matchCustomArea" class="hidden">
              <label for="customJdText">岗位描述 (JD)</label>
              <textarea id="customJdText" class="input-textarea" placeholder="在此粘贴或输入岗位JD内容..."></textarea>
              <label for="customResumeText">简历内容</label>
              <textarea id="customResumeText" class="input-textarea" placeholder="在此粘贴或输入简历内容..."></textarea>
            </div>

            <button id="runMatchBtn" class="primary-button" type="button">运行匹配诊断</button>
          </div>

          <div class="control-group">
            <label for="payloadBox">当前输入</label>
            <textarea id="payloadBox" spellcheck="false"></textarea>
          </div>
        </aside>

        <section class="graph-panel" aria-label="图谱可视化">
          <div class="graph-toolbar">
            <div class="segmented">
              <button id="viewAll" class="segment active" type="button">全部</button>
              <button id="viewStack" class="segment" type="button">技术栈</button>
              <button id="viewLevel" class="segment" type="button">级别</button>
            </div>
            <div id="graphMeta" class="graph-meta">等待数据</div>
          </div>
          <svg id="graphSvg" role="img" aria-label="岗位能力图谱"></svg>
        </section>

        <aside class="result-panel">
          <section>
            <h2>结果摘要</h2>
            <div id="summaryMetrics" class="metric-grid"></div>
          </section>
          <section>
            <h2>技能与缺口</h2>
            <div id="skillList" class="list-block"></div>
          </section>
          <section>
            <h2>解释</h2>
            <p id="explanation" class="explanation-text">暂无结果</p>
          </section>
        </aside>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
